[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vietdub"
version = "0.2.0"
description = "Tự động lồng tiếng Việt cho video bằng công cụ mã nguồn mở"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
tts = ["edge-tts>=6.1"]
separate = ["demucs>=4.0"]
ingest = ["yt-dlp"]
speakers = ["sherpa-onnx", "numpy"]
auto = ["psycopg[binary]>=3.1"]
web = ["starlette>=0.40", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "itsdangerous>=2.1"]
all = ["vietdub[asr,tts,speakers,separate,ingest,auto,web]"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
vietdub = "vietdub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vietdub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
